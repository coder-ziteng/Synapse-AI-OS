[workspace]
resolver = "2"
members = [
    "kernel",
    "hal",
    "cap",
    "ipc",
    "proc",
    "sched",
    "abi",
    "audit",
    "user",
    "kint",
    "xtask",
    "display",
    "vma",
    "elf",
]
# P4-T1：user/hello 是裸机用户态 bin crate（#![no_main] + user target json），
# 必须排除在宿主 workspace 外——否则宿主 cargo test 会尝试为宿主 target
# 链接它而失败。构建入口：`cargo run -p xtask -- user`。
# P4-T9e：user/crasher 同上（额外 crash smoke 子进程）。
# P4-T10：user/init 同上（Root Agent，启动链首进程）。
exclude = ["user/hello", "user/crasher", "user/init", "user/ipc-pong"]

# 共享包元信息（避免每个 crate 重复 license/authors）
[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

# 共享依赖将在 P1-T2 起逐步加入：
#   bootloader 0.9.x（BIOS 启动链）
#   x86_64（寄存器/特权级/GDT/TSS 辅助）
#   log（日志 facade）
#   uart_16550（仅参考用；HAL 化后不再直接依赖）
# 此处暂不声明，待具体任务时再加。
[workspace.dependencies]

# 内核 profile：panic abort（no_std 不支持 unwinding）+ 保留调试符号（栈回转需要）
[profile.dev]
panic = "abort"
debug = true
opt-level = 0

[profile.release]
panic = "abort"
debug = true        # release 镜像也要能栈回转
opt-level = 3
lto = "thin"
codegen-units = 1

# 用户态 profile（Phase 4 起用）
[profile.user]
inherits = "release"
panic = "abort"