[package]
name        = "synapse-kernel"
version     = "0.1.0"
edition.workspace     = true
rust-version.workspace = true
license.workspace      = true
description = "Synapse 微内核（Phase 1 占位）"
publish     = false

# 仅作为二进制存在；Phase 4 起可能拆出 lib.rs 供用户态服务复用
[[bin]]
name = "synapse-kernel"
path = "src/main.rs"
test = false  # 不构建 bin 的 test 版本（避免 duplicate core lang item）

# P1-T8: 集成测试 self-contained — 测试框架代码直接放在 tests/basic_boot.rs
# （不创建 lib，避免与 main.rs 的 #[global_allocator] / C 运行时符号冲突）

[dependencies]
# HAL 依赖；P1-T7 UART 走 HAL::SerialDevice trait
synapse-hal = { path = "../hal" }

# x86_64 寄存器/特权级辅助
x86_64 = { version = "0.15", features = ["instructions"] }

# UART 16550 底层驱动
uart_16550 = "0.3"

# log facade（P1-T5）：info!/warn!/error! 等宏
log = { version = "0.4", default-features = false }

[lints.rust]
# 内核 entry / 内联汇编 / 中断处理需 unsafe；HAL 化后 unsafe 集中在 hal::arch 子模块
unsafe_code = "allow"
missing_docs = "warn"     # 核心 API 鼓励文档注释（rule 6）

# ===== 内核集成层 (2026-09-26): cap/ipc/proc 纯逻辑 crate 接入 =====
[dependencies.synapse-cap]
path = "../cap"

[dependencies.synapse-ipc]
path = "../ipc"

[dependencies.synapse-proc]
path = "../proc"

# ===== P3-T4 (2026-09-26): 调度纯逻辑 crate 接入（kthread 基建）=====
[dependencies.synapse-sched]
path = "../sched"

# ===== P4-T3 (2026-09-27): 用户内存区域表（VMA）纯逻辑 crate 接入 =====
[dependencies.synapse-vma]
path = "../vma"
