[package]
name        = "synapse-kint"
version     = "0.1.0"
edition.workspace     = true
rust-version.workspace = true
license.workspace      = true
description = "Synapse 内核集成层（host-testable mock dispatcher；后续 port 到 kernel/src/syscall）"
publish     = false

[lib]
path = "src/lib.rs"

[dependencies]
# 集成层把 5 个纯逻辑 crate 粘合在一起：decode 分发 → 子 crate 操作 → 审计记录。
synapse-abi   = { path = "../abi" }
synapse-cap   = { path = "../cap" }
synapse-ipc   = { path = "../ipc" }
synapse-proc  = { path = "../proc" }
synapse-audit = { path = "../audit" }

[dev-dependencies]
# 测试用 synapse-user 的 build_args_*（帧编码器）+ CapRef。
synapse-user  = { path = "../user" }

[lints.rust]
# 集成层需要持有 alloc（mock state 用 Vec 存 CapTable 等）；其它 API 一律 safe。
unsafe_code = "allow"
missing_docs = "warn"