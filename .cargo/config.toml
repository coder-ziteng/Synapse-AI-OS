# 裸机 target（x86_64-bootloader.json, os=none）:
# - force-frame-pointers: panic_handler 栈回转依赖 rbp 链（P1-T5 验收项）
# - 旧 runner = "bootimage runner" 已随 bootimage 方案一并废弃（见 task.json decision_log 2026-09-25）
[target.'cfg(target_os = "none")']
rustflags = ["-C", "force-frame-pointers=yes"]

# P1-T8 测试 runner（2026-09-26）：cargo test 产物 → build_disk 打包 → QEMU → 退出码翻译
# - cwd = 包根目录（kernel/），故用相对路径；脚本内部经 __file__ 解析仓库根，与 cwd 无关
# - 退出码：QEMU isa-debug-exit 103（全过）→ 0；175（存在失败）→ 1；其他 → 2
# - 注意：nightly-2026-09-23/Windows 上裸 `cargo test` + `-Zbuild-std` 触发双 core
#   E0152（构建期失败，runner 不会被执行）；当前稳定入口为
#   `python kernel/tests/run_tests.py`（cargo build --test + 本 runner），根因详见
#   task.json decision_log 2026-09-26 P1-T8 条目。toolchain 修复后本 runner 即生效。
[target.x86_64-bootloader]
runner = "python tests/qemu_test_runner.py"