[package]
name        = "synapse-audit"
version     = "0.1.0"
edition.workspace     = true
rust-version.workspace = true
license.workspace      = true
description = "Synapse 内核审计事件：FR9 事件点建模 + 固定大小事件记录 + 环形队列（热路径不阻塞，批量消费）"
publish     = false

[lib]
path = "src/lib.rs"

# 复用 cap（ObjKind/Rights/AgentId 语义）与 ipc（AgentId 数值形态）
[dependencies]
synapse-cap = { path = "../cap" }
synapse-ipc = { path = "../ipc" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
